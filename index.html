<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Résolution d'équations</title>
<link rel="icon" type="image/svg+xml" href="favicon-x-egal.svg" />
<script>
// Applique un thème explicitement choisi AVANT le premier rendu (évite un flash clair
// avant que theme.js ne s'exécute) ; sans choix explicite, la préférence système
// (@media prefers-color-scheme) suffit seule, en CSS pur, pas besoin de JS ici.
(function () {
  try {
    var stored = localStorage.getItem('equations-theme');
    if (stored === 'dark' || stored === 'light') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
<link rel="stylesheet" href="vendor/mathlive/mathlive-static.css" />
<link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="newEquationBtn" type="button" title="Nouvelle équation">+</button>
<button id="undoBtn" type="button" title="Annuler la dernière opération"></button>
<button id="mapBtn" type="button" title="La Carte des équations" aria-label="Carte"></button>
<button id="themeToggleBtn" type="button"></button>
<button id="settingsBtn" type="button" title="Réglages"></button>
<button id="zoomInBtn" type="button" title="Zoom avant"></button>
<button id="zoomOutBtn" type="button" title="Zoom arrière"></button>

<main id="historyScroll">
  <div id="canvasLayer">
    <div id="history" aria-live="polite"></div>
    <div id="opButtons" hidden>
      <div class="op-buttons-arrow"></div>
      <div class="op-row"><button type="button" data-op="expr">Opération</button></div>
      <div class="op-row"><button type="button" data-op="simplify">Simplifier</button></div>
      <div class="op-row"><button type="button" data-op="factor">Factoriser</button></div>
      <div class="op-row"><button type="button" data-op="expand">Développer</button></div>
      <div class="op-row"><button type="button" data-op="produitnul">Produit nul</button></div>
      <div class="op-row"><button type="button" data-op="existence">Condition d'existence</button></div>
      <div class="op-row"><button type="button" data-op="signchart">Tableau de signes</button></div>
    </div>
  </div>
</main>

<div id="controlPanel" hidden></div>

<div id="levelBar" hidden>
  <div class="level-bar-main">
    <div class="level-where"><b data-level-title></b><small data-level-zone></small></div>
    <span class="level-steps" data-level-steps title="Étapes utilisées (« Simplifier » ne compte pas)"></span>
    <button type="button" class="map-pill" data-level-hint>Indice</button>
    <button type="button" class="map-pill ghost" data-level-restart>Recommencer</button>
  </div>
  <div class="level-statement" data-level-statement hidden></div>
  <div class="level-msg" data-level-msg hidden></div>
</div>
<div id="levelHint" hidden>
  <button type="button" class="level-hint-close" data-hint-close title="Fermer" aria-label="Fermer">✕</button>
  <div data-hint-text></div>
  <small data-hint-note></small>
</div>
<div id="levelWin" hidden>
  <button type="button" class="level-hint-close" data-win-close title="Fermer" aria-label="Fermer">✕</button>
  <h3 data-win-title></h3>
  <div class="win-stars"><span data-win-star>★</span><span data-win-star>★</span><span data-win-star>★</span></div>
  <div class="win-criteria" data-win-criteria></div>
  <div class="win-actions">
    <button type="button" class="map-pill ghost" data-win-replay>Rejouer</button>
    <button type="button" class="map-pill" data-win-map>Carte</button>
    <button type="button" class="map-pill solid" data-win-next>Suivant</button>
  </div>
</div>
<div id="campaignToast" role="status"><span class="toast-ico" data-toast-ico></span><div><b data-toast-title></b><br><span data-toast-text></span></div></div>

<div id="mapOverlay" hidden>
  <div class="map-viewport"><svg class="map-svg" aria-label="Carte des équations"></svg></div>
  <div class="map-bar">
    <b>La Carte des équations</b>
    <span class="map-stat"><span class="map-star">★</span> <b data-map-stars>0</b> / <span data-map-max>0</span></span>
    <button type="button" class="map-pill ghost" data-map-badges-btn>Badges <b data-map-badges>0</b></button>
    <button type="button" class="map-pill" data-map-free>Mode libre</button>
  </div>
  <div class="map-badges" hidden></div>
  <div class="map-card" hidden></div>
  <div class="map-zoom">
    <button type="button" data-map-zoom="in" title="Zoom avant" aria-label="Zoom avant">+</button>
    <button type="button" data-map-zoom="out" title="Zoom arrière" aria-label="Zoom arrière">−</button>
  </div>
</div>

<div id="settingsOverlay" class="modal-overlay" hidden>
  <div class="modal-box">
    <button id="settingsClose" type="button" class="modal-close" title="Fermer">✕</button>
    <h2>Réglages</h2>
    <div class="settings-list">
      <label class="settings-row">
        <span class="settings-label">Toujours simplifier après une opération</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="autoSimplify" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
    </div>
    <div class="settings-group-title">Progression de la campagne</div>
    <div class="progress-actions">
      <button type="button" class="map-pill" id="progressExport">Exporter ma progression</button>
      <button type="button" class="map-pill ghost" id="progressImport">Importer…</button>
      <input type="file" id="progressImportFile" accept=".json,application/json" hidden />
    </div>
    <div class="progress-note" id="progressNote">Ta progression est enregistrée dans ce navigateur. Exporte-la pour la retrouver sur un autre ordinateur.</div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal-box">
    <button id="modalClose" type="button" class="modal-close" title="Fermer">✕</button>
    <h2>Nouvelle équation</h2>
    <div class="modal-section">
      <div id="manualInputSlot"></div>
      <div class="relation-picker" id="relationPicker">
        <button type="button" class="relation-btn" data-relation="=">=</button>
        <button type="button" class="relation-btn" data-relation="&gt;">&gt;</button>
        <button type="button" class="relation-btn" data-relation="&lt;">&lt;</button>
        <button type="button" class="relation-btn" data-relation="\geq">&ge;</button>
        <button type="button" class="relation-btn" data-relation="\leq">&le;</button>
      </div>
      <div id="manualError" class="panel-error"></div>
    </div>
    <div class="modal-section">
      <button id="randomGenerate" type="button">Générer aléatoirement<span class="gen-options-gear" title="Options de génération"></span></button>
      <button id="manualSubmit" type="button">Valider</button>
    </div>
  </div>
</div>

<div id="generatorOverlay" class="modal-overlay" hidden>
  <div class="modal-box">
    <button id="generatorClose" type="button" class="modal-close" title="Fermer">✕</button>
    <h2>Options de génération</h2>
    <div class="settings-group-title">Expressions</div>
    <div class="settings-list">
      <label class="settings-row">
        <span class="settings-label">Inéquations</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_inequality" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Fractions</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_fraction" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Racines carrées</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_sqrt" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
    </div>
    <div class="settings-group-title">Méthodes de résolution</div>
    <div class="settings-list">
      <label class="settings-row">
        <span class="settings-label">Factorisation</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_factoring" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Identités remarquables</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_identities" data-requires="gen_factoring" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Produit nul</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_produitNul" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Domaine de définition</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_domain" data-requires="gen_fraction gen_sqrt" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
      <label class="settings-row">
        <span class="settings-label">Tableau de signes</span>
        <span class="ios-switch">
          <input type="checkbox" role="switch" data-setting="gen_signChart" data-requires="gen_inequality" />
          <span class="ios-switch-track"></span>
        </span>
      </label>
    </div>
    <div class="settings-group-title">Degré de l'équation</div>
    <div class="degree-range-block">
      <div class="degree-range">
        <div class="degree-range-track"><div class="degree-range-fill"></div></div>
        <div class="degree-thumb" data-degree="min" tabindex="0" role="slider" aria-label="Degré minimal"></div>
        <div class="degree-thumb" data-degree="max" tabindex="0" role="slider" aria-label="Degré maximal"></div>
      </div>
      <div class="degree-range-ticks"><span>1</span><span>2</span><span>3</span></div>
    </div>
    <div id="generatorEmpty" class="panel-error"></div>
  </div>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/mathlive/mathlive.min.js"></script>
<script src="js/expression.js"></script>
<script src="js/equation.js"></script>
<script src="js/inequality.js"></script>
<script src="js/parser.js"></script>
<script src="js/generator.js"></script>
<script src="js/levels.js"></script>
<script src="js/progress.js"></script>
<script src="js/history.js"></script>
<script src="js/canvas.js"></script>
<script src="js/zoom.js"></script>
<script src="js/render.js"></script>
<script src="js/arrows.js"></script>
<script src="js/toolbar.js"></script>
<script src="js/mathKeypad.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/newEquationModal.js"></script>
<script src="js/theme.js"></script>
<script src="js/settings.js"></script>
<script src="js/map.js"></script>
<script src="js/campaign.js"></script>
<script src="js/main.js"></script>
</body>
</html>
